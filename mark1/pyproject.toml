[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark1"
version = "0.0.1"
description = "Mark-1: phone-camera AI assistant grounded in an approved-knowledge vault"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["mark1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
