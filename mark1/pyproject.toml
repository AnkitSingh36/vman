[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark1"
version = "0.1.0"
description = "Mark-1: phone-camera AI assistant grounded in an approved-knowledge vault"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "pillow==13.0.0",
    "python-multipart==0.0.33",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]
legacy-tests = ["google-genai==3.0.0"]

[tool.setuptools.packages.find]
include = ["mark1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
